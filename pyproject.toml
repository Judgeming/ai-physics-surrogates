[project]
name = "ai-physics-surrogates"
version = "0.1.0"
description = "Neural-network surrogates for physics simulations: PyTorch fundamentals, neural operators, and simulation agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
]

[dependency-groups]
dev = ["pytest>=8"]

# RTX 50-series (Blackwell) needs CUDA 12.8+ wheels from the PyTorch index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["p0_pytorch_basics/tests"]
pythonpath = ["."]
